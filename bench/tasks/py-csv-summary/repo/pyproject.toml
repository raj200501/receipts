[project]
name = "csvsummary"
version = "1.3.0"
description = "Row counts and per-column statistics for CSV exports."
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
csvsummary = "csvsummary.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
