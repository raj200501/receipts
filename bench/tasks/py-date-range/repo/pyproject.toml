[project]
name = "dateseq"
version = "0.6.2"
description = "Dates of a period, one per line: for backfills, reports, and shell loops."
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
dateseq = "dateseq.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
