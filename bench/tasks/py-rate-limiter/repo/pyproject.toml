[project]
name = "throttle"
version = "2.1.0"
description = "Per-client token-bucket rate limits for the API gateway, and a log replay tool."
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
throttle = "throttle.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
