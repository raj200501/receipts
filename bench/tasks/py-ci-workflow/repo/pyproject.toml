[project]
name = "releasenotes"
version = "0.9.2"
description = "Build release notes and version bumps from conventional commit subjects."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
releasenotes = "releasenotes.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
